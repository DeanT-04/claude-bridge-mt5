# Execution costs and tradable symbols per prop firm (plan P2), keyed by `firm` in propfirms.yaml.
# Collected 2026-09-25 from each firm's own pages (see `sources`); no trial accounts were used.
# research/firmcosts.py turns these into engine Costs for any BlackBull symbol.
#
# commission_rt:  ROUND-TRIP commission per 1.0 lot by asset class:
#                   usd: flat USD per lot  |  pct: % of the notional (lots x contract x price)
#                 Asset classes: Forex, Metals, Energies, Indices, Crypto.
# pricing:        raw (raw spread + commission) or spread (commission built into the spread)
# symbols:        the firm's own symbol codes; research/firmcosts.py maps them to BlackBull
#                 names (e.g. US100.cash -> NAS100). null = not published.
# spreads:        per-symbol spread multipliers vs BlackBull come from live snapshots of the
#                 firm's published spread table (config/spread_snapshots.jsonl). Firms without a
#                 public table use the median ratio of the raw-spread firms, per asset class.
# leverage:       challenge leverage by asset class (informational; margin isn't simulated)
# verify:         items the sources left ambiguous

FTMO:
  pricing: raw
  commission_rt:
    Forex: {usd: 5}
    Metals: {pct: 0.0014}
    Energies: {usd: 0}
    Indices: {usd: 0}
    Crypto: {pct: 0.065}           # = 0.0325% per side (FTMO crypto blog), so the table is round trip
  leverage: {Forex: 100, Energies: 50, Indices: 50}
  symbols: [AUD/CAD, AUD/CHF, AUD/JPY, AUD/NZD, AUD/USD, CAD/CHF, CAD/JPY, CHF/JPY, EUR/AUD, EUR/CAD,
            EUR/CHF, EUR/CZK, EUR/GBP, EUR/HUF, EUR/JPY, EUR/NOK, EUR/NZD, EUR/PLN, EUR/USD, GBP/AUD,
            GBP/CAD, GBP/CHF, GBP/JPY, GBP/NZD, GBP/USD, NZD/CAD, NZD/CHF, NZD/JPY, NZD/USD, USD/CAD,
            USD/CHF, USD/CNH, USD/CZK, USD/HKD, USD/HUF, USD/ILS, USD/JPY, USD/MXN, USD/NOK, USD/PLN,
            USD/SEK, USD/SGD, USD/ZAR, XAG/AUD, XAG/EUR, XAG/USD, XAU/AUD, XAU/EUR, XAU/USD, XPD/USD,
            XPT/USD, XCU/USD, AUS200.cash, US30.cash, SPN35.cash, EU50.cash, FRA40.cash, GER40.cash,
            HK50.cash, JP225.cash, N25.cash, US100.cash, US500.cash, UK100.cash, US2000.cash,
            UKOIL.cash, USOIL.cash, NATGAS.cash, BTCUSD, ETHUSD, LTCUSD, XRPUSD, XMRUSD, ADAUSD,
            DOTUSD, DOGEUSD, SOLUSD, BCHUSD, XLMUSD, LNKUSD, AVAUSD, BNBUSD, ETCUSD, DASHUSD, NEOUSD]
  verify: [metals and crypto leverage]
  sources: [https://ftmo.com/en/symbols/, https://ftmo.com/wp-json/ftmo/symbols]

