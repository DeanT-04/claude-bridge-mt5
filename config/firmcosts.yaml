The5ers:
  pricing: raw                     # raw + commission on FX and gold; spread-only on indices, oil, crypto
  commission_rt:
    Forex: {usd: 4}
    Metals: {usd: 4}
    Energies: {usd: 0}
    Indices: {usd: 0}
    Crypto: {usd: 0}
  spread_only_classes: [Energies, Indices, Crypto]   # priced like BlackBull's spread account
  leverage: {Forex: 100}
  symbols: null                   # -> symbols listed by at least two of FTMO/FundedNext/FundingPips
  verify: [symbol list and non-FX commissions are only shown inside MT5; gold commission assumed $4]
  sources: [https://the5ers.com/asset-specifications/, https://the5ers.com/high-stakes/]

FXIFY:
  pricing: raw                     # Raw feed chosen at checkout (All-In = no commission, wider spreads)
  commission_rt:
    Forex: {usd: 6}
    Metals: {usd: 6}
    Energies: {usd: 0}             # "$6/lot" is published for FX, index CFDs and metals, but FXIFY's
    Indices: {usd: 0}              # index/energy lot sizes aren't; on BlackBull's 1-unit index lot $6
    Crypto: {usd: 0}               # would be ~6 points, so these stay unmodelled (see verify)
  leverage: {Forex: 30}
  symbols: null                   # -> symbols listed by at least two of FTMO/FundedNext/FundingPips
  verify: [index/energy/crypto commissions and lot sizes (modelled 0), symbol list (100+ instruments)]
  sources: [https://fxify.com/faqs/all-faqs/do-you-offer-raw-spreads/, https://fxify.com/faqs/all-faqs/what-are-your-spreads/]
