# Prop-firm challenge programs modelled by the pipeline: the five most-used forex/CFD MT5 firms
# (by Trustpilot review volume, with FXIFY replacing the poorly rated The Funded Trader), 1-step
# and 2-step evaluations only (instant funding is out of scope for now).
# Researched 2026-09-25 from firm sites/help centres and review sites (see `sources`).
# RULES AND PRICES CHANGE OFTEN: re-verify on the firm's own site before buying.
#
# Program fields
#   sizes:                every account size offered, smallest -> largest, with its fee
#                         (fee null = no reliable published figure; fee_currency applies to all)
#   phase_targets:        profit target % per phase (2-step = two entries). Each phase restarts
#                         from the initial balance with fresh limits.
#   max_daily_loss_pct:   % of the INITIAL balance a single day may lose
#   daily_loss_basis:     reference at the start of each day: balance | equity | max (higher)
#   max_total_dd_pct:     % of the initial balance
#   max_dd_mode:          static (floor fixed at initial - X%) | trailing (floor follows the
#                         equity high); trailing_locks_at_initial: the trailing floor stops
#                         rising once it reaches the initial balance
#   min_trading_days:     per phase
#   min_profitable_days:  days whose closed profit >= profitable_day_pct of initial (The5ers)
#   best_day_max_share:   best day's profit <= this share of all positive days' profit when
#                         passing (0 = no rule)
#   max_days:             0 = unlimited (simulated up to 250 trading days)
#   weekend_flat_hour:    Friday server hour after which positions must be flat (0 = may hold)
#   news_blackout_min:    no trading within +/- N minutes of high-impact news (0 = allowed)
#   leverage:             forex leverage on the account (lower on indices/metals/crypto)
#   ea_policy:            what the firm says about expert advisors
#   verify:               items the sources disagreed on or didn't state

ftmo_2step:
  firm: FTMO
  program: FTMO Challenge (2-step)
  fee_currency: EUR
  sizes:
    - {size: 10000, fee: 155}        # one source lists EUR 89
    - {size: 25000, fee: 250}
    - {size: 50000, fee: 345}
    - {size: 100000, fee: 540}
    - {size: 200000, fee: 1080}
  phase_targets: [10, 5]
  max_daily_loss_pct: 5
  daily_loss_basis: balance
  max_total_dd_pct: 10
  max_dd_mode: static
  min_trading_days: 4
  leverage: 100
  ea_policy: allowed without approval; keep under 2,000 server requests per instrument per day
  verify: [10K fee (EUR 89 vs 155), best-day rule scope on 2-step]
  sources: [https://ftmo.com/en/trading-objectives/, https://brokeranalysis.com/prop-trading-firms/ftmo/pricing/]

