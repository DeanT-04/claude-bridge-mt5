# Prop-firm challenge programs modelled by the pipeline: the five most-used forex/CFD MT5 firms
# (by Trustpilot review volume, with FXIFY replacing the poorly rated The Funded Trader), 1-step
# and 2-step evaluations only (instant funding is out of scope for now).
# Researched 2026-09-25 and re-verified the same day (plan P2) against each firm's own pages
# (see `sources`); review sites are no longer used. Fees are list prices without promo codes.
# RULES AND PRICES CHANGE OFTEN: re-verify on the firm's own site before buying.
# Execution costs and symbol lists per firm: config/firmcosts.yaml.
#
# Program fields
#   sizes:                every account size offered, smallest -> largest, with its fee
#                         (fee null = no reliable published figure; fee_currency applies to all)
#   phase_targets:        profit target % per phase (2-step = two entries). Each phase restarts
#                         from the initial balance with fresh limits.
#   max_daily_loss_pct:   % a single day may lose (of the initial balance, or see daily_loss_ref)
#   daily_loss_basis:     reference at the start of each day: balance | equity | max (higher)
#   daily_loss_ref:       initial (default: % of the initial balance) | baseline (% of that day's
#                         reference itself, e.g. FundingPips, The5ers)
#   max_total_dd_pct:     % of the initial balance
#   max_dd_mode:          static (floor fixed at initial - X%) | trailing (floor follows the high)
#   trailing_basis:       equity (default) | balance (closed balance) | eod_balance (highest
#                         end-of-day balance, e.g. FTMO 1-Step)
#   trailing_locks_at_initial: the trailing floor stops rising once it reaches the initial balance
#   min_trading_days:     per phase
#   min_profitable_days:  days whose closed profit >= profitable_day_pct of initial (The5ers)
#   best_day_max_share:   best day's profit <= this share of all positive days' profit when
#                         passing (0 = no rule)
#   max_days:             0 = unlimited (simulated up to 250 trading days)
#   weekend_flat_hour:    Friday server hour after which positions must be flat (0 = may hold)
#   news_blackout_min:    no trading within +/- N minutes of high-impact news (0 = allowed)
#   leverage:             forex leverage on the account (lower on indices/metals/crypto)
#   ea_policy:            what the firm says about expert advisors
#   ea_max_size:          largest size where EAs are allowed (0 = all); larger sizes are listed but
#                         never proposed, ranked or used as the default
#   verify:               items the sources left ambiguous

ftmo_2step:
  firm: FTMO
  program: FTMO Challenge (2-step)
  fee_currency: EUR
  sizes:
    - {size: 10000, fee: 89}
    - {size: 25000, fee: 250}
    - {size: 50000, fee: 345}
    - {size: 100000, fee: 540}
    - {size: 200000, fee: 1080}
  phase_targets: [10, 5]
  max_daily_loss_pct: 5
  daily_loss_basis: balance
  max_total_dd_pct: 10
  max_dd_mode: static
  min_trading_days: 4
  leverage: 100
  ea_policy: allowed without approval; platform limits of 200 open orders and 2,000 positions per day
  verify: [the day resets at 00:00 CE(S)T, one hour before the MT5 server's midnight]
  sources: [https://ftmo.com/en/trading-objectives/, https://ftmo.com/en/,
            https://ftmo.com/en/faq/which-instruments-can-i-trade-and-what-strategies-am-i-allowed-to-use/]

