# Generic prop-firm rule profiles. Percentages are of the INITIAL account balance unless noted.
# Copy a profile and edit it to match a specific firm's published rules before using it.
#
# daily_loss_basis: the daily limit is measured from the start-of-day ...
#   balance | equity | max  (max = higher of balance and equity, the strictest common variant)
# max_dd_mode: static   = floor at initial_balance × (1 − max_dd)
#              trailing = floor trails the equity high-water mark (common on one-step accounts)
# weekend_flat_hour: Friday server hour after which positions are closed (0 = allowed to hold)
# news_blackout_min: no new entries within ± N minutes of high-impact news for the symbol's
#   currencies (MT5 economic calendar; 0 = off)

two_step_standard:
  description: Classic two-phase evaluation (phase 1 shown; phase 2 usually 5% target)
  account_size: 10000
  profit_target_pct: 8
  max_daily_loss_pct: 5
  daily_loss_basis: max
  max_total_dd_pct: 10
  max_dd_mode: static
  min_trading_days: 4
  max_days: 0              # 0 = unlimited
  weekend_flat_hour: 0
  news_blackout_min: 0

one_step_trailing:
  description: Single-phase evaluation with trailing drawdown
  account_size: 10000
  profit_target_pct: 10
  max_daily_loss_pct: 4
  daily_loss_basis: max
  max_total_dd_pct: 6
  max_dd_mode: trailing
  min_trading_days: 3
  max_days: 0
  weekend_flat_hour: 22
  news_blackout_min: 2

instant_funded:
  description: Funded from day one; no target, tight limits (simulated as survival over 60 days)
  account_size: 5000
  profit_target_pct: 0
  max_daily_loss_pct: 3
  daily_loss_basis: max
  max_total_dd_pct: 6
  max_dd_mode: trailing
  min_trading_days: 0
  max_days: 60
  weekend_flat_hour: 22
  news_blackout_min: 5
