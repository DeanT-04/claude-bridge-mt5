# All paths are overridable so the stack can move to a VPS unchanged.
terminal:
  install_dir: C:\Program Files\BlackBull Markets MT5
  # Data dir of the live/demo terminal (where MQL5\ sources get synced for the host EA).
  data_dir: ${APPDATA}\MetaQuotes\Terminal\16D9C17040576AD13C62C316983027D5
  common_files: ${APPDATA}\MetaQuotes\Terminal\Common\Files

# Trading terminals by target. demo = the existing BlackBull install (logged into the demo).
# live = a separate portable copy (scripts/setup_terminal.py live), logged in by the user, so
# demo history stays readable and neither account can touch the other. On a VPS, point these
# at the VPS paths.
terminals:
  demo:
    install_dir: C:\Program Files\BlackBull Markets MT5
    portable: false
  live:
    install_dir: runtime\live
    portable: true
  # Example prop target (uncomment, run scripts/setup_terminal.py prop_example, log in yourself):
  # prop_example:
  #   install_dir: runtime\prop_example
  #   portable: true
  #   account_mode: demo        # many challenge accounts are demo-mode on the firm's server

tester:
  # Portable copy used exclusively for Strategy Tester runs (created by scripts/setup_tester.py).
  install_dir: runtime\tester
  timeout_sec: 7200
  # The tester needs <base><deposit ccy> crosses (e.g. XAUGBP) with full history to test in GBP;
  # BlackBull's are short, so tests run in USD with the target deposit converted at today's rate.
  currency: USD

account:
  # Backtests model the real target account, not the demo.
  deposit: 100
  currency: GBP
  leverage: 100
  # Demo is USD 1000; demo lot sizing is scaled so risk % mirrors the live target.
  demo_scale_to_target: true
  live_enabled: false
  # Non-demo/live targets (e.g. prop challenges) you have logged in and allow deployment to.
  enabled_targets: []

research:
  timeframes: [M15, M30, H1]
  core_symbols: [EURUSD, GBPUSD, USDJPY, AUDUSD, XAUUSD, XAGUSD, BTCUSD, ETHUSD, NAS100]
  history_start: 2019-01-01
  holdout_months: 12

deployment:
  # Written into portfolio_<target>.cfg and enforced by QB_Host itself.
  max_daily_loss_pct: 5
  max_total_dd_pct: 30
  max_open_risk_pct: 6
  # Risk used for demo forward-test sleeves that did not pass the gauntlet (allow_unvalidated).
  unvalidated_risk_pct: 0.5
  # Forward-test bar before a sleeve may be promoted to live.
  promote_min_trades: 30
  promote_min_days: 28
  magic_base: 900000          # must match QB_Host InpMagicBase
  # Prop configs tighten the firm's daily/total limits by this factor (0.8 = stop at 80%).
  prop_safety_buffer: 0.8

paths:
  registry_db: runtime\registry.sqlite
  reports: runtime\reports
