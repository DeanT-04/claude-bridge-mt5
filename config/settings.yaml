# All paths are overridable so the stack can move to a VPS unchanged.
terminal:
  # BlackBull install: source of market data (research proxy for every prop firm's feed).
  install_dir: C:\Program Files\BlackBull Markets MT5
  # Data dir of that terminal (QB sources are synced into its MQL5\ for the demo host EA).
  data_dir: ${APPDATA}\MetaQuotes\Terminal\16D9C17040576AD13C62C316983027D5
  common_files: ${APPDATA}\MetaQuotes\Terminal\Common\Files

# Trading terminals by deployment target. `demo` = the BlackBull install (forward tests).
# Each prop account gets its OWN portable terminal (scripts/setup_terminal.py <name>), logged in
# by the user, with `profile` naming its program in config/propfirms.yaml and `account_mode`
# telling QB_Host what account type to expect (most challenge accounts are demo-mode).
terminals:
  demo:                           # BlackBull demo (USD 10,000, 1:100) for forward tests
    install_dir: C:\Program Files\BlackBull Markets MT5
    portable: false
  # Example (uncomment, run scripts/setup_terminal.py ftmo_50k, log in yourself, then add it
  # to account.enabled_targets):
  # ftmo_50k:
  #   install_dir: runtime\ftmo_50k
  #   portable: true
  #   account_mode: demo          # most challenge accounts are demo-mode on the firm's server
  #   profile: ftmo_2step         # program key in config/propfirms.yaml
  #   size: 50000                 # one of that program's sizes
  #   ea_approved: false          # firms that require EA approval (FXIFY): set true once granted

tester:
  # Portable copy used exclusively for Strategy Tester runs (scripts/setup_terminal.py tester).
  install_dir: runtime\tester
  timeout_sec: 7200
  currency: USD

# The account every backtest models (default challenge size; rules are %-based, so pass
# probabilities hold for every size, while fees and min-lot limits depend on it).
account:
  deposit: 50000
  currency: USD
  leverage: 100
  # Prop targets (terminal names above) the user has logged in and allows deployment to.
  enabled_targets: []

research:
  timeframes: [M15, M30, H1]
  core_symbols: [EURUSD, GBPUSD, USDJPY, AUDUSD, XAUUSD, NAS100, SPX500, US30, GER40, BTCUSD]
  history_start: 2019-01-01
  holdout_months: 12

deployment:
  # Defaults written into portfolio_<target>.cfg; a prop profile overrides them (tightened).
  max_daily_loss_pct: 4
  max_total_dd_pct: 8
  max_open_risk_pct: 3
  # Risk for demo forward-test sleeves that did not pass the gauntlet (allow_unvalidated).
  unvalidated_risk_pct: 0.5
  # Forward-test bar on demo before a sleeve may go to a prop account.
  promote_min_trades: 30
  promote_min_days: 28
  magic_base: 900000          # must match QB_Host InpMagicBase
  # Prop configs tighten the firm's daily/total limits by this factor (0.8 = stop at 80%).
  prop_safety_buffer: 0.8

paths:
  registry_db: runtime\registry.sqlite
  reports: runtime\reports
