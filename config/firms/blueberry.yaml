# Blueberry Funded (prop arm of Blueberry Markets): Prime (2-phase) and 1-Step Challenge.
#
# blueberryfunded.com serves a bot-check ("Please wait ... optimizing your request") page to
# automated readers, so the marketing site was NOT scraped. Rules were read from the firm's own
# Intercom help centre, help.blueberryfunded.com, which served plain HTTP on 2026-09-25
# (`fetched` in `sources`). Every rule cites a source key.
#
# PRODUCT CHANGE: the old 2-Step Challenge (10% / 5% targets, 5% daily) was withdrawn from sale on
# 17 August 2026 (prime_overview). "Prime" is a separate 2-phase product with its own rules; the
# 2-Step numbers still quoted by review sites do NOT apply to new purchases.
# Rules also changed for accounts bought on/after 12 March 2026 (prohibited strategies,
# 1.5% risk per trade idea); this file models accounts bought NOW (after 17 Aug 2026).
firm: blueberry
name: Blueberry Funded
verified_on: 2026-09-25
platform: mt5            # MT5 and TradeLocker (lot_sizes)

sources:
  prime_overview:  {url: "https://help.blueberryfunded.com/en/articles/12136509-what-is-the-prime-challenge", fetched: "2026-09-25"}
  prime_drawdown:  {url: "https://help.blueberryfunded.com/en/articles/12136586-what-are-the-drawdown-limits-on-a-prime-account", fetched: "2026-09-25"}
  prime_reward:    {url: "https://help.blueberryfunded.com/en/articles/12136624-prime-reward-structure", fetched: "2026-09-25"}
  prime_news:      {url: "https://help.blueberryfunded.com/en/articles/12140938-news-trading-policy-for-prime-challenge", fetched: "2026-09-25"}
  prime_breach:    {url: "https://help.blueberryfunded.com/en/articles/12140976-what-happens-if-you-breach-the-rules-in-the-prime-challenge", fetched: "2026-09-25"}
  prime_lots:      {url: "https://help.blueberryfunded.com/en/articles/14051815-prime-lot-size-restriction-rule", fetched: "2026-09-25"}
  active_days:     {url: "https://help.blueberryfunded.com/en/articles/12136639-how-many-active-trading-days-do-i-need", fetched: "2026-09-25"}
  breach_rules:    {url: "https://help.blueberryfunded.com/en/articles/15310153-what-rules-can-breach-my-account-and-where-do-i-find-the-limits", fetched: "2026-09-25"}
  one_step_guide:  {url: "https://help.blueberryfunded.com/en/articles/14070623-1-step-challenge-complete-guide", fetched: "2026-09-25"}
  reward_freq:     {url: "https://help.blueberryfunded.com/en/articles/9550911-frequency-of-performance-rewards", fetched: "2026-09-25"}
  scaling:         {url: "https://help.blueberryfunded.com/en/articles/9762548-blueberry-funded-account-scaling", fetched: "2026-09-25"}
